<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".55" stop-color="#e11d48"/><stop offset="1" stop-color="#ff3b30"/></linearGradient>
<linearGradient id="gline" gradientUnits="userSpaceOnUse" x1="110" y1="0" x2="890" y2="0"><stop offset="0" stop-color="#f5f5f7" stop-opacity=".25"/><stop offset=".7" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff3b30"/></linearGradient>
<linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="860" y1="0" x2="920" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".55" stop-color="#e11d48"/><stop offset="1" stop-color="#ff3b30"/></linearGradient></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","Inter",Helvetica,Arial,sans-serif}
text:not([fill]){fill:#f5f5f7}
text.m{fill:#86868b}
.up{animation:up .9s cubic-bezier(.16,1,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.draw{stroke-dashoffset:100;animation:draw 1.8s .2s cubic-bezier(.65,0,.35,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(2.6);opacity:0}}
</style>

<rect width="1000" height="220" rx="28" fill="#121214"/>
<line x1="110" y1="92" x2="890" y2="92" stroke="#2c2c2e" stroke-width="2"/>
<line x1="110" y1="92" x2="890" y2="92" stroke="url(#gline)" stroke-width="2" pathLength="100" stroke-dasharray="100" class="draw"/>
<g class="up" style="animation-delay:0.30s">
<text x="110" y="66" text-anchor="middle" font-size="14" font-weight="600" class="m">SMR</text>

<circle cx="110" cy="92" r="7" fill="#f5f5f7"/>
<text x="110" y="134" text-anchor="middle" font-size="17" font-weight="600">Sistemas y redes</text>
<text x="110" y="158" text-anchor="middle" font-size="15" class="m">La base</text></g><g class="up" style="animation-delay:0.60s">
<text x="305" y="66" text-anchor="middle" font-size="14" font-weight="600" class="m">2023</text>

<circle cx="305" cy="92" r="7" fill="#f5f5f7"/>
<text x="305" y="134" text-anchor="middle" font-size="17" font-weight="600">Técnico de redes</text>
<text x="305" y="158" text-anchor="middle" font-size="15" class="m">Fone</text></g><g class="up" style="animation-delay:0.90s">
<text x="500" y="66" text-anchor="middle" font-size="14" font-weight="600" class="m">2024</text>

<circle cx="500" cy="92" r="7" fill="#f5f5f7"/>
<text x="500" y="134" text-anchor="middle" font-size="17" font-weight="600">Full-stack en agencia</text>
<text x="500" y="158" text-anchor="middle" font-size="15" class="m">Rechgo</text></g><g class="up" style="animation-delay:1.20s">
<text x="695" y="66" text-anchor="middle" font-size="14" font-weight="600" class="m">2026</text>

<circle cx="695" cy="92" r="7" fill="#f5f5f7"/>
<text x="695" y="134" text-anchor="middle" font-size="17" font-weight="600">DAM, 2º año</text>
<text x="695" y="158" text-anchor="middle" font-size="15" class="m">Universae</text></g><g class="up" style="animation-delay:1.50s">
<text x="890" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="url(#gl)">Próximo</text>
<circle cx="890" cy="92" r="7" fill="none" stroke="#ff3b30" class="ping"/>
<circle cx="890" cy="92" r="7" fill="url(#g)"/>
<text x="890" y="134" text-anchor="middle" font-size="17" font-weight="600">Apps iOS y Android</text>
<text x="890" y="158" text-anchor="middle" font-size="15" class="m">Mobile</text></g>
</svg>