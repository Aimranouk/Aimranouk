<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 104" width="1000" height="104">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".55" stop-color="#e11d48"/><stop offset="1" stop-color="#ff3b30"/></linearGradient></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","Inter",Helvetica,Arial,sans-serif}
text:not([fill]){fill:#f5f5f7}
text.m{fill:#86868b}
.up{animation:up .9s cubic-bezier(.16,1,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

</style>

<text x="4" y="56" font-size="40" font-weight="700" letter-spacing="-1.2" class="up">Con qué trabajo.</text>
<text x="4" y="88" font-size="19" class="m up" style="animation-delay:.1s">Las herramientas de cada día.</text>
</svg>